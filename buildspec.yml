version: 0.2

env:
  shell: bash
  variables:
    BUILD_ENV: "production"
  parameter-store:
    NPM_REGISTRY: "/devops-020-130/npm-registry-url"
    NPM_TOKEN: "/devops-020-130/npm-auth-token"
  secrets-manager:
    DOCKER_USERNAME: "devops-020-130/docker-credentials:username"
    DOCKER_PASSWORD: "devops-020-130/docker-credentials:password"
    DOCKER_REGISTRY: "devops-020-130/docker-credentials:registry"
    DB_CONNECTION_STRING: "devops-020-130/database-credentials:connectionString"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== INSTALL PHASE ==="
      - echo "Installing dependencies..."
      - npm install

  pre_build:
    commands:
      - echo "=== PRE_BUILD: Verifying secrets retrieval ==="
      - echo "Build Environment: $BUILD_ENV"
      - echo "NPM Registry: $NPM_REGISTRY"
      - echo "Docker Username: $DOCKER_USERNAME"
      - echo ""
      - echo "Note: Sensitive values are masked with *** in logs"
      - echo "NPM Token value (masked): $NPM_TOKEN"
      - echo "Docker Password value (masked): $DOCKER_PASSWORD"
      - echo "DB Connection String (masked): $DB_CONNECTION_STRING"
      - echo ""
      - echo "Secrets retrieval successful!"

  build:
    commands:
      - echo "=== BUILD PHASE ==="
      - echo "Configuring NPM registry..."
      - npm config set registry $NPM_REGISTRY || true
      - npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN || true
      - echo ""
      - echo "Docker login (demo credentials - wrapped with || true)..."
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY || true
      - echo ""
      - echo "Running tests..."
      - npm test || true
      - echo ""
      - echo "Building application..."
      - npm run build || true
      - echo ""
      - echo "Docker build (demo - wrapped with || true)..."
      - docker build -t myapp:$CODEBUILD_BUILD_NUMBER . || true
      - echo ""
      - echo "Build phase complete"

  post_build:
    commands:
      - echo "=== POST_BUILD ==="
      - echo "Build completed successfully"
      - echo "All secrets were retrieved and used securely"

artifacts:
  files:
    - "**/*"
  discard-paths: no
